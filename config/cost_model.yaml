# The shadow venue's cost model. Read by hftlab.venues.sim (load_cost_model).
#
# EVERY NUMBER HERE IS A PLACEHOLDER, TO BE REPLACED BY THE PROBE'S MEASUREMENTS and the broker's published
# commission schedule. They are round figures that make the arithmetic run, chosen to be on the costly side;
# no result computed with them is a result. A change to this file is an evaluation change: it needs a decision
# record, and `effective_from` says from which UTC date the new values apply.
# HFT-EXP-0007 (the probe's first real run) changes nothing here: it sampled the minutes after the weekly open,
# when spreads are at their widest, placed no order, and so measured no cost and no timing.
# HFT-EXP-0008 (its second, in the Asian session, with four test orders) changes no number here either. What it
# measured, for the decision record that sets these numbers to weigh, and for nothing before that:
#   median spread, one 30-second sample per pair: EUR.USD 0.2 pip, USD.JPY 0.4 pip, AUD.USD 0.2 pip, GBP.USD 0.4 pip
#   median time between two changes of the top of the book: 345, 342, 423 and 339 ms, in that order
#   size below which the venue routes an order as an odd lot: 20,000 (EUR, GBP base) and 25,000 (USD, AUD base)
#   no commission (nothing filled) and no latency (timed from a laptop in Sydney, on orders the broker rejected)
# One 30-second sample moves nothing. A DECISION RECORD MUST SET THESE NUMBERS; until one does they are placeholders.
version: 1
status: placeholder
effective_from: "2026-10-11"

latency_us:                  # PLACEHOLDER: decision to arrival at the venue; the probe measures ack_us
  min: 20000
  max: 80000

commission:
  rate_bps: "0.20"           # PLACEHOLDER: of the trade value, per order
  minimum:                   # PLACEHOLDER: per order, in the pair's quote currency
    USD: "2.00"
    JPY: "300.00"

min_order_size: 20000        # PLACEHOLDER: base-currency units below which the venue's pricing is worse
slippage_increments: 0       # PLACEHOLDER: price increments lost beyond the quoted price on a marketable order
stale_after_ms: 2000         # PLACEHOLDER: no fill against a quote the venue has not confirmed for this long

rollover:                    # around 17:00 New York
  no_fill_before_min: 5      # PLACEHOLDER
  no_fill_after_min: 15      # PLACEHOLDER
  widen_before_min: 30       # PLACEHOLDER
  widen_after_min: 60        # PLACEHOLDER
  spread_multiplier: "3.00"  # PLACEHOLDER: the quoted spread is taken as this many times wider in that window
