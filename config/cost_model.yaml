# The shadow venue's cost model. Read by hftlab.venues.sim (load_cost_model).
#
# DECIDED by HFT-DEC-0002 (research/decisions/), as a PROPOSAL the owner approved by merging the pull request
# that carried it and may change. Each value says where it comes from:
#   measured                  the capability probe's run with test orders on 2026-10-12 (HFT-EXP-0008), one
#                             30-second sample a pair in the Asian session, from a laptop and not from the host
#   published, not measured   the broker's published commission schedule; no fill of ours has shown it yet
#   chosen                    an engineering choice on the costly side, with nothing measured behind it
# A change to this file is an evaluation change: it needs a decision record, and `effective_from` says from
# which UTC date the new values apply.
#
# NOTE OF 2026-10-13 (HFT-EXP-0009). No value here is changed by it; the values are HFT-DEC-0002's. Seven fills
# of our own on the paper account on 2026-10-12 were each charged 2.874 AUD, which is the published minimum of
# USD 2.00 an order, in the account's own currency: the commission MINIMUM is now measured, and agrees with the
# value below. The rate above the minimum is still published, not measured (no order was large enough to reach
# it). Slippage is still NOT MEASURED: those seven fills were at the quoted touch or better, small orders in a
# quiet hour, and say nothing about a sleeve's orders in busy hours. The broker's acceptance of those orders
# was seen 462 to 1,812 ms after sending, from a laptop: longer than `latency_us.max`, and not the host's.
#
# The spread is not a number here: the shadow venue fills against the recorded quote, so the measured spreads
# (EUR.USD and AUD.USD about 0.2 pip, GBP.USD and USD.JPY about 0.4 pip in ordinary hours) are in every fill
# already. What the measured spreads set is the spread guard in config/risk.yaml.
version: 1
status: decided              # placeholder | decided | measured. `measured` waits for fills of our own
decision: HFT-DEC-0002
effective_from: "2026-10-12"

latency_us:                  # measured, loosely: an order's acknowledgement took 200 to 385 ms from the owner's laptop
  min: 100000                # chosen: half the fastest acknowledgement seen, for the way there alone
  max: 400000                # measured: just over the slowest acknowledgement seen, which is there and back

commission:
  rate_bps: "0.20"           # published, not measured: of the trade value, per order
  minimum:                   # published, not measured: per order. The broker charges it in the account's own
    USD: "2.00"              # currency; the shadow book charges it in the pair's quote currency
    JPY: "320.00"            # the USD minimum at the rate the probe sampled, rounded up

min_order_size: 20000        # measured: the venue's own warning names it as the size under which an order is an odd lot
min_order_size_by_base:      # measured, the same way: 25,000 where the base currency is USD or AUD
  USD: 25000
  AUD: 25000
slippage_increments: 0       # chosen, NOT MEASURED: nothing has filled. The trader's slippage report measures it
stale_after_ms: 3000         # chosen from the measured quote rate: one to three changes a second, gaps of up to 5 s

rollover:                    # around 17:00 New York. All chosen: the probe has not sampled a rollover
  no_fill_before_min: 5
  no_fill_after_min: 15
  widen_before_min: 30
  widen_after_min: 60
  spread_multiplier: "3.00"  # the quoted spread is taken as this many times wider in that window
