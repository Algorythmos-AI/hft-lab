# The host and operations layer's settings. Read by hftlab.ops (status, backup) and hftlab.publish.
#
# Where the recorder records and where the shadow runner keeps its journal are NOT set here. They are read from
# config/recorder.yaml (`root`) and config/shadow.yaml (`journal_dir`), so this file cannot disagree with them.
# No address and no key is here either: those come from the environment (docs/runbooks/publish.md).
status:
  dead_man_seconds: 60          # ENGINEERING DEFAULT. The recorder writes its status every 5 s. A status that
                                # still says "recording" and is older than this, while the market is open,
                                # means the recorder is dead: the dead-man rule
  disk_warn_percent: 90         # ENGINEERING DEFAULT. Warn when the recording has used this much of its quota

publish:
  timeout_seconds: 20           # ENGINEERING DEFAULT. How long one send of the snapshot may take

backup:
  tool: null                    # null: copy into the backup directory (HFT_BACKUP_DIR). Otherwise a command, as
                                # a list of words, that is handed the tag and a file listing what to back up:
                                #   [restic, backup, --tag, "{tag}", --files-from, "{list}"]
                                # A command that forgets, prunes or deletes is refused.

# When the learning loop's two weekend jobs start (ADR 0023, docs/runbooks/learning.md). The unit files are
# rendered from these two values: after changing one, run `python -m hftlab.ops.units render --out deploy/systemd`.
# Both are PLACEHOLDERS and both are the owner's: training must not overlap the other desks' weekend jobs on
# the host, which nobody but the owner knows. The market is shut from Friday 17:00 to Sunday 17:15 New York.
# Neither timer is enabled by the install script.
learning:
  train_at: "Sat *-*-* 03:00:00 America/New_York"     # PLACEHOLDER. A Saturday, any time
  promote_at: "Sun *-*-* 12:00:00 America/New_York"   # PLACEHOLDER. A Sunday before 17:00, after training

# The state of each phase of docs/roadmap.md, as the status snapshot reports it: `done` when the phase's exit
# gate is met, `open` when its code is written and its gate is not met, `not_started` otherwise. It changes in
# the same pull request as the roadmap, and a test compares the two.
#
# F4 is `open`, and stays so until its gate is met: its code is complete against the fake broker, its gate
# needs five trading days on the real paper account (HFT-EXP-0002, not run), and nothing has traded.
#
# F5 is `not_started`, and that is the truthful state of the phase, not of the code. Its foundations are
# written and tested on synthetic streams (features, labels, datasets, validation, the model file, an exact
# ridge model, an ML sleeve). Its deliverables are not: no Directional Change sleeve, no model trained on
# real data, no sleeve trading on paper.
#
# F6 is `open`: the weekly loop's code is written and tested on synthetic data and against the fake broker
# (weekend training, the lineup journal, challengers in shadow, the weekly decision with rollback and its
# drill, the drift look, the two units). Its gate is not met: two full weekly cycles without manual help
# and one rollback drill, on the host. Nothing has been trained on real data, no promotion rule exists, and
# the scorer in its own process and a deep challenger are not built.
phases:
  F0: done
  F1: open
  F2: open
  F3: open
  F4: open
  F5: not_started
  F6: open
  F7: not_started
