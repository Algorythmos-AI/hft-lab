# Capability file for the Interactive Brokers paper account.
#
# PARTLY MEASURED. The capability probe has run twice against the real paper gateway:
#   HFT-EXP-0007  2026-10-11, read-only, in the minutes after the weekly open: the contract descriptions and
#                 what is on offer (depth, historical ticks);
#   HFT-EXP-0008  2026-10-12, with four test orders, in the Asian session, from the owner's laptop: the update
#                 interval of an ordinary session, what the broker did with a spot BUY, and the venue's minimum
#                 for good pricing as the broker's own warning names it.
# What those runs can vouch for is filled in below; everything else is null, and each null says what would
# measure it. Nothing here is a cost: no spread, no commission, no order timing of the host.
#
# WHAT THE ACCOUNT MAY DO ON SPOT, AS MEASURED (HFT-EXP-0008): NOTHING THAT OPENS A POSITION FROM FLAT. Every
# one-unit BUY was rejected: the account holds none of the currency that pays and may not borrow it, and it may
# not hold yen at all. Spot on this account is conversion of cash it already holds. The SELL side is not tested.
# The trader reads `spot_position_opening` and refuses any stage above shadow for a pair it does not show as
# accepted on both sides (hftlab.venues.capability). That is a permission, not a cost.
#
# `status` is one of:
#   placeholder       nothing measured
#   partly_measured   contract descriptions and what is on offer are measured; costs, timings and tradability are not
#   probed            all of it measured in liquid hours, with an order round trip; code may then read costs from here
# Code must not read a cost or a timing from this file while the status is anything but `probed`.
#
# The two decisions this file feeds (access route, instrument form) are research records that do not exist yet.
# Both now wait on the owner's choice between cash balances held in each currency and CFDs (HFT-EXP-0008,
# finding b).
#
# Units: sizes in whole base-currency units, times in milliseconds, prices as decimal text, money as decimal
# text converted with hftlab.core.money (never a float).
venue: ibkr_paper
status: partly_measured
probed_at: "2026-10-12"             # UTC date of the latest probe run recorded below
probe_record: HFT-EXP-0008          # the research record of that run; it names the earlier one, HFT-EXP-0007

access_route: null                  # gateway | web_api: an HFT-DEC record, after an order timing taken on the host
instrument_form: null               # cash | cfd: an HFT-DEC record, after the owner's choice in HFT-EXP-0008, finding b

# Where `good_pricing_min_size` comes from: the broker's own warning on a one-unit order, which names the size
# below which an order is routed as an odd lot (HFT-EXP-0008). A warning text, not a fill and not a schedule.
good_pricing_min_size_source: broker_odd_lot_warning

# Per pair:
#   resolves                 the forms in which the gateway DESCRIBES the contract. Not the forms the account may trade.
#   price_increment          the contract's own smallest price step, per form
#   depth_levels             book levels the gateway sent when asked for five
#   min_order_size           the smallest order the gateway takes. It reports less than one unit for these pairs and
#                            the adapter takes that as one whole unit. This is NOT the size from which its pricing is
#                            good: that is `good_pricing_min_size`.
#   good_pricing_min_size    base-currency units below which the venue routes an order as an odd lot; see the source above
#   update_interval_ms       the median time between two changes of the top of the book, in whole milliseconds
#                            rounded down, over one 30-second sample in the session named beside it. ONE SAMPLE.
#   update_interval_session  the session that sample was taken in: asian | london | new_york | weekly_open
#   spot_position_opening    what the broker did with a one-unit spot order that would open a position from flat:
#                              buy, sell           accepted | refused | null (that side was not tested)
#                              buy_refusal, sell_refusal   the class of the refusal, from the fixed table in
#                                                  hftlab.venues.ibkr.refusals; null when not refused or not captured
#                            `buy: refused` was measured WITHOUT the paying currency in the account. What an order
#                            with the cash behind it does is not measured.
#   commission               null: a fill would show it, or the broker's published schedule recorded by a decision
#   order_round_trip_ms      null: the one timing taken is from a laptop in Sydney, of orders the broker rejected.
#                            A probe run with --orders ON THE HOST, with an order the broker accepts, would measure it
pairs:
  - pair: EUR.USD
    resolves: [cash, cfd]
    price_scale: 5
    price_increment: {cash: "0.00005", cfd: "0.00001"}
    update_interval_ms: 345
    update_interval_session: asian
    depth_levels: 5
    min_order_size: 1
    size_increment: 1
    good_pricing_min_size: 20000    # EUR
    spot_position_opening:
      buy: refused                  # the account holds no US dollars and may not borrow them
      buy_refusal: insufficient_cash_quote_currency
      sell: null                    # not tested: the probe's orders are buys
      sell_refusal: null
    commission: {rate_bps: null, minimum: null, currency: null}
    order_round_trip_ms: {median: null, p99: null}
  - pair: USD.JPY
    resolves: [cash, cfd]
    price_scale: 3
    price_increment: {cash: "0.005", cfd: "0.001"}
    update_interval_ms: 342
    update_interval_session: asian
    depth_levels: 5
    min_order_size: 1
    size_increment: 1
    good_pricing_min_size: 25000    # USD
    spot_position_opening:
      buy: refused                  # the account may not open a position in yen at all
      buy_refusal: currency_not_permitted
      sell: null                    # not tested: the probe's orders are buys
      sell_refusal: null
    commission: {rate_bps: null, minimum: null, currency: null}
    order_round_trip_ms: {median: null, p99: null}
  - pair: AUD.USD
    resolves: [cash, cfd]
    price_scale: 5
    price_increment: {cash: "0.00005", cfd: "0.00001"}
    update_interval_ms: 423
    update_interval_session: asian
    depth_levels: 5
    min_order_size: 1
    size_increment: 1
    good_pricing_min_size: 25000    # AUD
    spot_position_opening:
      buy: refused                  # the account holds no US dollars and may not borrow them
      buy_refusal: insufficient_cash_quote_currency
      sell: null                    # not tested: the probe's orders are buys
      sell_refusal: null
    commission: {rate_bps: null, minimum: null, currency: null}
    order_round_trip_ms: {median: null, p99: null}
  - pair: GBP.USD
    resolves: [cash, cfd]
    price_scale: 5
    price_increment: {cash: "0.00005", cfd: "0.00001"}
    update_interval_ms: 338
    update_interval_session: asian
    depth_levels: 5
    min_order_size: 1
    size_increment: 1
    good_pricing_min_size: 20000    # GBP
    spot_position_opening:
      buy: refused                  # rejected; the message that says why was not captured by that run
      buy_refusal: null
      sell: null                    # not tested: the probe's orders are buys
      sell_refusal: null
    commission: {rate_bps: null, minimum: null, currency: null}
    order_round_trip_ms: {median: null, p99: null}

weekly_login:
  required: null                    # null: watching the session over a weekly reset would show it
  observed_behaviour: null          # null: the same week of watching, written down in one sentence
