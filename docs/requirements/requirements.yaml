# Requirements for HFT Lab.
#
# Schema (checked by tests/unit/test_requirements.py):
#
#   id               REQ-<AREA>-NNN, unique. AREA is one of SAFE, CORE, VEN, RISK, MKT, CONN, BOOK, REC, TEST,
#                    LEARN.
#   title            One line.
#   statement        What must be true, in our own words: "must" or "must not".
#   basis            Where the requirement comes from:
#                      engineering_judgement   our own design rule or guardrail
#                      knowledge_base          supported by claims in the private knowledge base (kb_claims)
#   status           seed (written, nothing proves it yet) | verified (the tests named in verified_by prove it)
#   verified_by      Repository paths of the tests that prove it; empty while status is seed.
#   rationale_cites  Citations that justify it. Empty for now: filled later from the knowledge base.
#   kb_claims        Claim ids in the private knowledge base. Empty for now: filled later.
#
# These are seed requirements drawn from the platform's design rules and guardrails. Every one has
# `basis: engineering_judgement`; none quotes or paraphrases source material. A requirement is never deleted:
# it is superseded by a new one that names it.
version: 1
requirements:
  - id: REQ-SAFE-001
    title: The paper-only lock decides, and nothing else can
    statement: >-
      A broker connection must count as paper only when the mode is paper, no live flag is set, the gateway
      port is a paper port, the broker reports at least one managed account and every one is a paper id, and
      the configured login is not a declared live login. No code outside the lock may name a live port or
      read the variables that select the mode.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/safety/test_lock.py, tests/safety/test_isolation.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-SAFE-002
    title: The lock is checked at connection and before every order
    statement: >-
      The platform must check the paper-only lock before it opens a connection, again on the account ids
      the broker reports before anything else is asked of it, and again before every order and cancel, and
      must send nothing when it refuses.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/safety/test_gate.py, tests/venues/test_guard.py, tests/venues/test_contract.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-SAFE-003
    title: A lock refusal is final and a reconnect starts unchecked
    statement: >-
      A refusal by the paper-only lock must end the venue object for good, with no retry, and a connection
      that replaces a lost one must pass the lock on its own account list before any order is accepted.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/safety/test_gate.py, tests/venues/test_guard.py, tests/venues/test_contract.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-VEN-001
    title: One venue port, the same contract for every implementation
    statement: >-
      Every venue must implement the one venue port in core types, and the broker adapter and the fake
      broker must produce the same events for the same market.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/venues/test_contract.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-VEN-002
    title: No order on a connection that has not been reconciled
    statement: >-
      A venue must refuse orders while it is disconnected and on every new connection until the caller has
      marked that connection reconciled, and must allow cancels in between.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/venues/test_guard.py, tests/venues/test_contract.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-VEN-003
    title: One guarded path to the broker
    statement: >-
      An order must reach the broker only through the guarded path, which a venue cannot replace, and an
      order that does not fit its instrument or reuses a client order id must be refused before it is sent.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/venues/test_guard.py, tests/venues/test_ibkr_adapter.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-VEN-004
    title: Exact translation at the broker boundary
    statement: >-
      A price or quantity received from the broker must be recovered exactly or reported as an error, never
      rounded, and no binary float must be sent in an order.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/venues/test_translate.py, tests/venues/test_ibkr_adapter.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-VEN-005
    title: The broker library and the network stay inside the adapter
    statement: >-
      The broker's client library must be imported only by the broker adapter, and no module outside the
      adapter and the recorder may import a network library.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/safety/test_isolation.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-VEN-006
    title: The probe is read-only unless told otherwise and leaves no order behind
    statement: >-
      The capability probe must place no order by default, and when it is asked to place orders it must
      cancel them whatever happens and report any that are still working.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/venues/test_probe.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-CORE-001
    title: Integer prices and quantities
    statement: >-
      Prices, quantities and cash amounts must be integers at a stated scale from the moment they enter the
      platform; a binary float must not be accepted where one is expected.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/core/test_money.py, tests/core/test_types.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-CORE-002
    title: Injected clock
    statement: >-
      Code outside the wall clock must not read system time; it must take the time from an injected clock
      in integer UTC nanoseconds.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/core/test_clock.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-RISK-001
    title: Independent risk gate before every order
    statement: >-
      Every order must pass a risk gate that is independent of the strategy that produced it and that
      rebuilds positions from fills rather than trusting the strategy's own view.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/risk/test_gate.py, tests/risk/test_structure.py, tests/exec/test_manager.py,
                  tests/venues/test_guard.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-RISK-002
    title: Hard limits
    statement: >-
      The risk gate must enforce a position limit per pair, a gross exposure limit, a leverage limit well
      under the regulatory cap, an order size limit, a price collar against the mid, an orders-per-minute
      limit and an order-to-trade ratio limit.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-RISK-003
    title: Loss latches
    statement: >-
      A daily loss latch and a drawdown latch must stop new entries per sleeve and for the desk, and a
      reject-streak breaker must stop entries after repeated rejects; a latch must survive a restart.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/risk/test_gate.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-RISK-004
    title: KILL and FLATTEN switches
    statement: >-
      While the KILL switch is set the platform must make no new entries and must keep managing exits; the
      FLATTEN switch must close every position.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-RISK-005
    title: The hard limits that need no currency conversion
    statement: >-
      The risk gate must refuse an order that could take a sleeve or the desk past the position limit of its
      pair with every order in flight counted in full, an order over the size limit, a price outside the
      collar around the mid, and an order beyond the orders-per-minute or order-to-trade limits, and it must
      open no pair beyond the number allowed at once. This is the part of REQ-RISK-002 that can be enforced
      without valuing positions in one currency; gross exposure and leverage stay with REQ-RISK-002.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/risk/test_gate.py, tests/risk/test_properties.py, tests/faults/test_invariants.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-MKT-001
    title: Market guards
    statement: >-
      The platform must not enter on a stale quote or a spread wider than its guard, must be flat and place
      no entries around the daily rollover and during a macro-event blackout, and must be flat before the
      Friday close.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-CONN-001
    title: No orders while blind
    statement: >-
      The platform must send no order while the market-data or order connection is down, and on reconnect
      must cancel working orders and reconcile before it resumes.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/exec/test_manager.py, tests/faults/test_faults.py, tests/risk/test_gate.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-CONN-002
    title: An order is journalled before it is sent and is never sent twice
    statement: >-
      The order manager must write an order durably to its outbox before handing it to the venue, and after
      a crash at any point must settle every order in flight by asking the venue under the order's client
      order id. It must not send again an order whose fate it cannot establish, and must book each fill
      exactly once however often and in whatever order it is reported.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/exec/test_manager.py, tests/exec/test_states.py, tests/faults/test_crash.py,
                  tests/faults/test_invariants.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-BOOK-001
    title: Two books, shadow book of record
    statement: >-
      Every fill must be booked in a broker book and in a shadow book with the platform's own latency,
      spread and slippage model, and every reported result and promotion test must read the shadow book.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-BOOK-002
    title: Reconciliation break stops entries
    statement: >-
      When the broker's positions and the platform's own disagree, new entries must stop and an alert must
      page until the break is resolved.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-BOOK-003
    title: The broker book is reconciled against the venue
    statement: >-
      A fill the venue reports and the broker book has not seen must be booked exactly once, and a position
      difference that outlives its grace time must set a break flag that stops new entries and clears only
      when the positions agree again and that agreement has been recorded. Paging on a break stays with
      REQ-BOOK-002.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/book/test_reconcile.py, tests/faults/test_faults.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-REC-001
    title: Recorder independent of the trader
    statement: >-
      The recorder must run as its own process, must keep recording when the trader stops, and must
      account for every gap in its recording.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-TEST-001
    title: Replay parity
    statement: >-
      The decisions taken while running must equal the decisions of an offline replay of the same
      recording.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-001
    title: Gated promotion with automatic rollback
    statement: >-
      A challenger model must replace the champion only after passing a promotion gate registered before
      its shadow week, and a promoted model that breaches its loss latch must be rolled back automatically.
    basis: engineering_judgement
    status: seed
    verified_by: []
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-002
    title: A feature is causal and the same offline and live
    statement: >-
      A feature row must be computed from the events up to and including the one it is stamped with, must
      hold exact integers only, and must come out the same whether a recording is read through or a live
      stream is taken one event at a time. A crossed book, a book nobody confirmed and a shut market must
      give no row.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/features/test_features.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-003
    title: Features are known before the label starts, and a label trains only after it has ended
    statement: >-
      The dataset builder must refuse feature rows that were, or say they were, made from anything after
      their own event, and a training fold must hold no row whose label window, with an embargo, had not
      ended before the first decision of its test week. A label must be priced with the cost model as the
      shadow venue prices, and must never be a price level.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/learn/test_dataset.py, tests/learn/test_validate.py, tests/labels/test_labels.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-004
    title: A hold-out is read once and every evaluated configuration is counted
    statement: >-
      Hold-out weeks must be in no fold and must be handed over once per frozen configuration, with the read
      written down before it happens. Every evaluation must be counted as a trial before it is scored, and
      the count that deflates a statistic must be the larger of the signed registry's and the ledger's own.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/learn/test_validate.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-005
    title: A model is named by its hash, never overwritten, and loaded only as what the caller expects
    statement: >-
      A model file must carry its parameters, feature keys, label, cost model and training dataset under one
      content hash, must hold no float, and must never be written over. Loading must refuse a file that does
      not match its hash and a model whose pair, features or label are not the ones asked for.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/models/test_models.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-006
    title: Learning code reaches no venue, and a sleeve that asks a model replays
    statement: >-
      The feature, label, learning and model packages must import no venue and call nothing that sends an
      order, and a label must be out of reach of anything a decision is made with. A sleeve that trades on a
      model's score must take the same decisions in a replay, byte for byte, and must report that it may not
      leave shadow while its model or its feasibility map rests on placeholder costs.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/learn/test_structure.py, tests/strategy/test_ml.py, tests/venues/test_guard.py]
    rationale_cites: []
    kb_claims: []

  - id: REQ-LEARN-007
    title: The promotion decision is a pure function of shadow results and a registered rule
    statement: >-
      The promotion decision must return promote only when every check of a rule that names its decision
      record has passed, must return roll back whenever the champion breached its loss latch, and must say
      why in reason codes. This is the part of REQ-LEARN-001 that needs no process; acting on the decision
      automatically stays with REQ-LEARN-001.
    basis: engineering_judgement
    status: verified
    verified_by: [tests/learn/test_promote.py]
    rationale_cites: []
    kb_claims: []
