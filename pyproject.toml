[project]
name = "hftlab"
version = "0.1.0"
description = "HFT Lab: high-frequency paper trading for the currency market (paper only)"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` for the package, `.` so the tests can import `tools.leakcheck`.
pythonpath = ["src", "."]
addopts = "-q -p no:cacheprovider --import-mode=importlib --strict-markers"
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "var", "logs", "models", "build"]

[tool.ruff.lint]
# Errors, bug-class rules, import order, modern syntax and simplifications. A new repository can afford all of
# them from the first commit; nothing here rewrites behaviour.
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# The whole package and the repository tools are held to --strict. Tests are not type-checked.
files = ["src/hftlab", "tools"]
strict = true
warn_unused_configs = true
