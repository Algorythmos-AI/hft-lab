# HFT-HYP-0003. A hypothesis record (research/README.md). Written before any result it concerns exists.
id: HFT-HYP-0003
title: The first ridge challenger shows no advantage over the control sleeve after costs
status: registered            # registered | supported | refuted. Changed only by a decision record
registered: "2026-10-11"
phase: F6                     # the first weekly cycle of the learning loop on recorded data

statement: >
  A ridge model fitted to the top-of-book features of one pair, trained at the weekend on the recordings and
  served for one trading week as a challenger in shadow, does not beat the control sleeve after costs:
  (a) the lower bound of the day-block bootstrap interval of its mean result per round trip, in the shadow
  book and after the modelled costs, is not above zero;
  (b) the lower bound of the same interval for its mean result per round trip less the control sleeve's, in
  the same pair over the same trading days, is not above zero.
  This is the outcome we expect. It is stated as the hypothesis so that a week that seems to show an edge has
  to refute something written down beforehand.

why: >
  The features are a handful of exact numbers of the best bid and ask: the spread, changes of the mid over a
  few look-backs, the quote rate, the size imbalance, the range, and three clock features (ADR 0020). The
  model is linear in them (ADR 0022). A round trip pays a spread and two commissions, and a fill-or-kill
  market order through a retail gateway arrives after the quote it was decided on. Anything this simple that
  survived those costs at a holding time of a minute would be surprising, and one week of one pair is little
  evidence. The control sleeve has no edge and loses its costs, so losing less than it is not an edge
  either: that is why (a) is asked beside (b).
  The loop itself is what F6 has to show: train, register, serve in shadow, weigh, keep. A week that ends in
  "keep" with honest numbers is the loop working.

what_would_show_it_is_wrong:
  - Both lower bounds above zero, with at least the trades and the trading days HFT-EXP-0003 asks for, on a
    report that does not rest on placeholders. That refutes the hypothesis for that week and that pair. It
    promotes nothing (see below).
  - A week that does not replay to the decisions it took (ADR 0005), or a challenger's place that served
    more than one model in the week. Then the week measured nothing, and says nothing either way.

what_it_does_not_say: >
  Nothing about whether a later model, another pair or another holding time has an edge. Nothing about a
  live account: every result is the shadow book's. And it is not a promotion rule. No rule is in force, no
  decision record exists, and HFT-EXP-0003 chooses none: a refuted hypothesis here is a reason to register
  a rule and a longer experiment, never a reason to promote the model that refuted it.

tested_by:
  - HFT-EXP-0003              # registered, NOT RUN

evidence: >
  None. Nothing has been recorded from the real feed, no model has been trained on real data and none has
  served. HFT-EXP-0003 has not been run. The loop's code runs on synthetic streams with a planted effect in
  tests/learn/ and tests/lineup/. Those tests check the code; they are not this experiment and are not
  evidence for this hypothesis.
